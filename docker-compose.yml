# ====================================================================
# AutoInfra Agent — Docker Compose Configuration
# ====================================================================
# Start: docker-compose up -d
# Stop:  docker-compose down
# Logs:  docker-compose logs -f
# ====================================================================

version: '3.8'

services:
  autoinfra-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: autoinfra-agent
    image: autoinfra/agent:latest
    restart: unless-stopped
    ports:
      - "3000:3000"   # HTTP API & Dashboard
      - "3001:3001"   # WebSocket
    environment:
      - NODE_ENV=production
      - SERVER_PORT=3000
      - SERVER_HOST=0.0.0.0
      - WS_PORT=3001
      - LOG_LEVEL=info
      - LOG_DIR=/app/logs
      - QUEUE_CONCURRENCY=3
      - QUEUE_MAX_RETRIES=3
      - HEALTH_CHECK_INTERVAL_SEC=60
      - CORS_ORIGIN=http://localhost:3000
      # - AI_API_KEY=${AI_API_KEY:-}          # Uncomment to enable AI features
      # - AI_PROVIDER=openai
      # - AI_MODEL=gpt-4-turbo
    volumes:
      - autoinfra-logs:/app/logs
      - autoinfra-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - autoinfra-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Redis for task queue persistence (when enabled)
  # autoinfra-redis:
  #   image: redis:7-alpine
  #   container_name: autoinfra-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - autoinfra-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

  # Optional: Prometheus for metrics (when METRICS_ENABLED=true)
  # autoinfra-prometheus:
  #   image: prom/prometheus:latest
  #   container_name: autoinfra-prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus-data:/prometheus
  #   networks:
  #     - autoinfra-network

volumes:
  autoinfra-logs:
    driver: local
  autoinfra-data:
    driver: local
  # redis-data:
  # prometheus-data:

networks:
  autoinfra-network:
    driver: bridge